name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-apple-silicon }
          - { os: macos-15-intel, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest tests -q
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./advisor/build_exe.ps1
          $out = "dist/AIMemoryAdvisor-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist/AIMemoryAdvisor.exe $out/
          Copy-Item advisor/README-for-testers.txt "$out/README.txt"
          Copy-Item "advisor/Share my data.cmd" $out/
          Compress-Archive -Path "$out/*" -DestinationPath "dist/AIMemoryAdvisor-${{ matrix.name }}.zip" -Force
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          bash advisor/build_mac.sh
          ditto -c -k --keepParent dist/AIMemoryAdvisor-mac "dist/AIMemoryAdvisor-${{ matrix.name }}.zip"
      - name: Smoke test (macOS, real app launch)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash advisor/smoke_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIMemoryAdvisor-${{ matrix.name }}
          path: dist/AIMemoryAdvisor-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "AI Memory Advisor ${{ github.ref_name }}" --notes "See README."
          gh release upload "${{ github.ref_name }}" "dist/AIMemoryAdvisor-${{ matrix.name }}.zip" --clobber